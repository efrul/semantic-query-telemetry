# Builds ZayitTelemetry.exe on Windows with the C# compiler that ships with it and runs the self-test on simulated
# Zayit and Otzaria databases. Given a version on workflow_dispatch it also publishes a release with the file.
name: Build

on:
  push:
    branches: [main, 'שליחת-נתוני-חיפוש']
  workflow_dispatch:
    inputs:
      version:
        description: 'גרסה לפרסום, למשל v1.0.0 (ריק: בנייה ובדיקה בלבד)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PARDES_FEEDBACK_URL: ${{ secrets.PARDES_FEEDBACK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: ./build.ps1

      - name: Self-test
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'selftest'
          $p = Start-Process dist\ZayitTelemetry.exe -ArgumentList '--selftest', "`"$dir`"" -Wait -PassThru
          Get-Content "$dir\selftest-report.txt" -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw 'self-test failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: ZayitTelemetry
          path: dist/ZayitTelemetry.exe

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" dist/ZayitTelemetry.exe --target "$GITHUB_SHA" --title "שליחת נתוני חיפוש — זית ואוצריא $VERSION" --notes-file .github/release-notes.md
